<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - El Atalaya Radio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          brand: { 900: '#071525', 800: '#0b1e3a', 700: '#16345e' },
          accent: { 500: '#c9932f', 400: '#e5b95f' }
        },
        fontFamily: { sans: ['Inter', 'sans-serif'] }
      }
    }
  }
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
</style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex overflow-hidden">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-brand-900 border-r border-gray-800 flex flex-col h-full shrink-0">
    <div class="p-6 flex items-center gap-3 border-b border-gray-800">
      <div class="w-10 h-10 bg-accent-500 rounded-xl flex items-center justify-center text-brand-900">
        <i data-lucide="radio" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight">El Atalaya</h1>
        <p class="text-xs text-accent-500 font-medium tracking-wide">ADMIN PANEL</p>
      </div>
    </div>
    
    <nav class="flex-1 p-4 space-y-2">
      <button onclick="switchTab('general', event)" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-accent-500 text-brand-900 font-semibold transition-all">
        <i data-lucide="settings" class="w-5 h-5"></i> General
      </button>
      <button onclick="switchTab('contenido', event)" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition-all">
        <i data-lucide="file-text" class="w-5 h-5"></i> Contenido
      </button>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 flex flex-col h-full overflow-hidden">
    <header class="h-16 border-b border-gray-800 flex items-center justify-between px-8 bg-gray-950/80 backdrop-blur">
      <h2 class="text-lg font-medium" id="pageTitle">Configuración General</h2>
      <button onclick="descargarConfig()" class="bg-green-600 hover:bg-green-500 text-white px-6 py-2 rounded-xl font-bold flex items-center gap-2 transition-all shadow-lg shadow-green-600/20">
        <i data-lucide="download" class="w-4 h-4"></i> Descargar Configuración
      </button>
    </header>

    <div class="flex-1 overflow-y-auto p-8">
      <div class="max-w-3xl mx-auto">
        
        <!-- TAB GENERAL -->
        <div id="tab-general" class="tab-content space-y-6">
          <div class="glass p-6 rounded-2xl space-y-4">
            <h3 class="text-xl font-semibold mb-4 border-b border-gray-800 pb-2">Datos Principales</h3>
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">Nombre de la Radio</label>
              <input type="text" id="siteName" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 focus:ring-2 focus:ring-accent-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">Subtítulo</label>
              <input type="text" id="tagline" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 focus:ring-2 focus:ring-accent-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">URL del Logo</label>
              <input type="url" id="logo" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 focus:ring-2 focus:ring-accent-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">URL de la Radio (Stream)</label>
              <input type="url" id="radioUrl" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 focus:ring-2 focus:ring-accent-500 focus:outline-none">
            </div>
          </div>
        </div>

        <!-- TAB CONTENIDO (NUEVO) -->
        <div id="tab-contenido" class="tab-content hidden space-y-6">
          <div class="glass p-6 rounded-2xl space-y-4">
            <h3 class="text-xl font-semibold mb-4 border-b border-gray-800 pb-2">Textos de las Secciones</h3>
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">Sección "Noticias"</label>
              <textarea id="txtNoticias" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 h-24 focus:ring-2 focus:ring-accent-500 focus:outline-none"></textarea>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">Sección "Programación"</label>
              <textarea id="txtProgramacion" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 h-24 focus:ring-2 focus:ring-accent-500 focus:outline-none"></textarea>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">Sección "Devocional"</label>
              <textarea id="txtDevocional" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 h-24 focus:ring-2 focus:ring-accent-500 focus:outline-none"></textarea>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-800 border border-gray-700 px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 z-50">
    <i data-lucide="check-circle" class="w-5 h-5 text-green-400"></i>
    <span id="toastMsg" class="font-medium text-sm">Archivo descargado</span>
  </div>

<script>
  lucide.createIcons();

  function switchTab(tabId, event) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    document.getElementById(`tab-${tabId}`).classList.remove('hidden');
    
    document.querySelectorAll('.tab-btn').forEach(el => {
      el.className = "tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition-all";
    });
    event.currentTarget.className = "tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-accent-500 text-brand-900 font-semibold transition-all";
    
    const titles = { general: 'Configuración General', contenido: 'Contenido de la Página' };
    document.getElementById('pageTitle').innerText = titles[tabId];
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toastMsg').innerText = msg;
    toast.className = "fixed bottom-6 right-6 transform translate-y-0 opacity-100 transition-all duration-300 bg-gray-800 border border-gray-700 px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 z-50";
    setTimeout(() => {
      toast.classList.replace('translate-y-0', 'translate-y-20');
      toast.classList.replace('opacity-100', 'opacity-0');
    }, 4000);
  }

  async function cargarConfig() {
    try {
      const res = await fetch('atalaya-config.json?_=' + Date.now());
      if (res.ok) {
        const data = await res.json();
        if(data.general) {
          document.getElementById('siteName').value = data.general.siteName || '';
          document.getElementById('tagline').value = data.general.tagline || '';
          document.getElementById('logo').value = data.general.logo || '';
        }
        if(data.streams) {
          document.getElementById('radioUrl').value = data.streams.radioUrl || '';
        }
        if(data.contenido) {
          document.getElementById('txtNoticias').value = data.contenido.noticias || '';
          document.getElementById('txtProgramacion').value = data.contenido.programacion || '';
          document.getElementById('txtDevocional').value = data.contenido.devocional || '';
        }
      }
    } catch(e) {
      // Placeholders
      document.getElementById('siteName').value = 'El Atalaya Radio oficial';
      document.getElementById('tagline').value = 'Radio TV Pentecostal';
      document.getElementById('radioUrl').value = 'https://radiohost.com.ar/8012/stream';
    }
  }

  function descargarConfig() {
    let newConfig = {
      general: {
        siteName: document.getElementById('siteName').value,
        tagline: document.getElementById('tagline').value,
        logo: document.getElementById('logo').value
      },
      streams: {
        radioUrl: document.getElementById('radioUrl').value
      },
      contenido: {
        noticias: document.getElementById('txtNoticias').value,
        programacion: document.getElementById('txtProgramacion').value,
        devocional: document.getElementById('txtDevocional').value
      }
    };

    const jsonString = JSON.stringify(newConfig, null, 2);
    const blob = new Blob([jsonString], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    
    const a = document.createElement('a');
    a.href = url;
    a.download = 'atalaya-config.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    showToast('✅ Descargado. Subilo a GitHub.');
  }

  cargarConfig();
</script>
</body>
</html>
